# Engine configuration: engineering choices made by this project, NOT channel rules.
# Channel rules (fees, dispute windows) live only in config/rules/ with source URLs.
# Every value here is ours and documented in docs/DECISIONS.md; none claims to be what the
# channel publishes. Decimals are quoted strings so YAML never turns them into floats.

# What a line's amount means (D-011).
#   fee:        money the channel took. Recoverable = the overcharge.
#   loss_event: a loss or refund event; amount = reimbursement already paid (0.00 = none).
#               What is owed needs a unit value no upstream record provides, so these are
#               never CLAIM. The decision per evidence outcome is in loss_event_outcomes.
charge_types:
  inbound_defect_fee:
    kind: fee
    # full_amount: a fee that should not have been charged is recoverable in full.
    claim_basis: full_amount
    pods:
      prep: {window: before_posting, max_days_before: 120, match_keys: [fba_shipment_id]}
    # Prep checks in scope when the line names no defect category ("prep/label scope").
    scope_checks: [polybag_present_sealed, suffocation_warning, fnsku_label_placement,
                   original_barcode_covered, expiry_date, handling_marks]
  fulfilment_fee_weight_tier:
    kind: fee
    # fee_difference: recoverable = fee charged - correct fee; needs the sourced fee schedule.
    claim_basis: fee_difference
    pods:
      prep: {window: before_posting, max_days_before: 120, match_keys: [fba_shipment_id]}
    # Evidence that can speak to a weight-tier fee. No upstream pod records these today.
    required_checks: [measured_weight, measured_dimensions]
  lost_inbound:
    kind: loss_event
    claim_basis: unit_value
    pods:
      # A prep record on the same FBA shipment shows the unit was prepared for that shipment.
      prep: {window: before_posting, max_days_before: 120, match_keys: [fba_shipment_id]}
      # A later customer return of the same unit is inconsistent with "lost inbound".
      returns: {window: after_posting, max_days_after: 180, match_keys: []}
    # Receiving is deliberately not relevant: a supplier shortfall is not a channel loss.
  damaged_in_warehouse:
    kind: loss_event
    claim_basis: unit_value
    pods:
      prep: {window: before_posting, max_days_before: 120, match_keys: [fba_shipment_id]}
  refund_issued_item_not_returned:
    kind: loss_event
    claim_basis: unit_value
    pods:
      returns: {window: around_posting, max_days_before: 60, max_days_after: 60,
                match_keys: [order_id]}

# Inbound defect categories (optional `defect_category` column on the fee report) and the
# prep checks that can show each category was NOT present. A category not listed here
# cannot be covered by evidence and goes to REVIEW.
inbound_defect_categories:
  label: [fnsku_label_placement, original_barcode_covered]
  polybag: [polybag_present_sealed]
  suffocation_warning: [suffocation_warning]
  expiry_date: [expiry_date]
  handling_marks: [handling_marks]

# Loss events: decision per charge type and evidence outcome (D-016). evidence_status is
# always relative to what the line asserts: CONTRADICTED = "the evidence says the line is
# wrong". For a fee that means recover; for a loss event it means the loss the seller would
# be reimbursed for is doubtful or did not happen, so it is never a claim.
# Outcomes are set by app/engine/assess.py. Rows with amount_needed: true are the claim
# path: the evidence supports the loss but no amount can be computed (D-011), so they are
# REVIEW until an authoritative unit value exists. Only those rows may suggest an override
# with an amount. INSUFFICIENT and CONFLICTING evidence use the generic rules, not this table.
# `no_evidence` is added to the reason when nothing speaks to the charge (R_NO_RELEVANT_EVIDENCE).
loss_event_outcomes:
  refund_issued_item_not_returned:
    outcomes:
      # Identity, parts and condition all PASS: the ordered item came back whole, so the seller
      # has the item and nothing is owed for a non-return.
      returned_complete:
        evidence_status: CONTRADICTED
        decision: DO_NOT_CLAIM
        rule_id: R_ITEM_RETURNED
        reason: "the ordered item was returned with identity, parts and condition all PASS, so nothing is owed for a non-return"
      # Identity PASS but parts FAIL/not recorded, or condition FAIL/UNCERTAIN/not recorded:
      # the item came back, but a returns claim for its condition or missing parts may exist.
      returned_incomplete_or_damaged:
        evidence_status: CONTRADICTED
        decision: REVIEW
        rule_id: R_RETURNED_INCOMPLETE_OR_DAMAGED
        reason: "item returned; incomplete, damaged or condition uncertain; possible separate claim"
        next_action: "The item came back, so do not claim a non-return. Check the photos and parts list for damage or missing parts; filing for those needs a channel rule not yet sourced in config/rules."
      # Identity FAIL: a different item came back, so the ordered item was not returned.
      # Supports the seller's claim; REVIEW until an amount is computable.
      wrong_item_returned:
        evidence_status: SUPPORTED
        decision: REVIEW
        rule_id: R_AMOUNT_NOT_COMPUTABLE
        amount_needed: true
        reason: "a different item came back, so the ordered item was not returned"
    no_evidence: "no return was recorded in the custody window; the absence is consistent with the seller's claim that the item was not returned, but it is not evidence"
  lost_inbound:
    outcomes:
      # Prep shows the unit was prepared for this shipment and nothing saw it afterwards:
      # consistent with the loss. REVIEW until an amount is computable.
      shipped_no_later_sighting:
        evidence_status: SUPPORTED
        decision: REVIEW
        rule_id: R_AMOUNT_NOT_COMPUTABLE
        amount_needed: true
        reason: "the unit was prepared for this shipment and no later record shows it, consistent with the loss"
      # A final customer return of the unit after the loss, identity PASS: the loss is
      # doubtful. Never a claim.
      later_sighting:
        evidence_status: CONTRADICTED
        decision: REVIEW
        rule_id: R_LOSS_DOUBTFUL
        reason: "the unit was seen after the loss was posted, so the loss is doubtful"
        next_action: "Do not claim this loss. If the later return is linked to the wrong unit, correct the upstream record and re-run."
  damaged_in_warehouse:
    outcomes:
      # A final prep record with every check PASS: the unit left prep sound, consistent with
      # warehouse damage. REVIEW until an amount is computable. Any FAIL or UNCERTAIN check,
      # or no checks, is INSUFFICIENT (generic rule), not this row.
      left_prep_undamaged:
        evidence_status: SUPPORTED
        decision: REVIEW
        rule_id: R_AMOUNT_NOT_COMPUTABLE
        amount_needed: true
        reason: "the unit left prep with every check passed, consistent with damage in the warehouse"

duplicate:
  # Two fee lines with the same fingerprint posted this many days apart or less are
  # treated as a duplicate; the earliest is canonical.
  window_days: 30

# Deterministic confidence (documented in ARCHITECTURE.md). Confidence is how strongly
# the inputs determine a check's verdict. It is never produced by a model.
confidence:
  exact: "1.00"            # key comparison, date or Decimal arithmetic on ingested data
  operator_check: "0.90"   # verdict read from a human operator's recorded check
